# Builds HomeworkHQ and publishes it to GitHub Pages
# every time changes are pushed to the main branch.
name: Deploy to GitHub Pages

on:
  # Run on every push to main
  push:
    branches: ['main']

  # Also allow running it by hand from the Actions tab
  workflow_dispatch:

# Permissions the workflow needs to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen close together, only the newest one deploys
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code quality (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Make page refreshes work (copy index.html to 404.html)
        run: cp dist/index.html dist/404.html

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5