<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="HomeworkHQ - a simple homework and test planner for middle and high school students."
    />
    <title>HomeworkHQ</title>

    <!-- Set the light/dark theme BEFORE the page draws, so it never flashes the wrong one. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('homeworkhq-theme') || '"auto"');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved !== 'light' && prefersDark);
          document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        } catch (error) {
          // If anything goes wrong, Bootstrap's default (light) is used.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
